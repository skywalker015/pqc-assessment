[package]
name = "pqc-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "pqc_backend"
path = "src/lib.rs"

[build-dependencies]
tonic-build = "0.12"

[dependencies]
pqc-common = { path = "../../libs/common" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }

[dev-dependencies]
tempfile = "3.12"

