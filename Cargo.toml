[workspace]
members = [
  "libs/common",
  "apps/backend",
  "sensors/network",
  "sensors/device",
  "sensors/remote",
  "sensors/discovery"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["sqlite", "postgres", "runtime-tokio", "tls-rustls"] }
rhai = "1.19.0"
