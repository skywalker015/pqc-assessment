[package]
name = "pqc-common"
version = "0.1.0"
edition = "2021"

[lib]
name = "pqc_common"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.10.0", features = ["v4", "serde"] }
